<!DOCTYPE html>
<html>
  <head>
    <title>Đồng Hồ Đếm Ngược</title>
  </head>

  <body>
    <!-- Ô input để nhập số giây -->
    <input type="text" id="secondsInput" placeholder="Nhập số giây" />

    <!-- Nút button -->
    <button onclick="startCountdown()">Đếm ngược</button>

    <!-- Thẻ <p> để hiển thị kết quả đếm ngược -->
    <p id="countdownResult"></p>

    <!-- Liên kết file JavaScript -->
    <script src="script.js"></script>
  </body>
</html>
