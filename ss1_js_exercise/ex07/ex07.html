<!DOCTYPE html>
<html>
<head>
    <title>Tính Số Ngày Trong Tháng</title>
</head>
<body>
    <!-- Ô input để nhập tháng -->
    <input
        type="number"
        id="monthInput"
        min="1"
        max="12"
        placeholder="Nhập tháng (1-12)"
    />

    <!-- Nút button để tính số ngày -->
    <button onclick="calculateDays()">Số ngày</button>

    <!-- Thẻ <p> để hiển thị kết quả -->
    <p id="result"></p>

    <!-- Liên kết file JavaScript -->
    <script src="script.js"></script>
</body>
</html>
