<!DOCTYPE html>
<html>
<head>
    <title>Ứng Dụng Máy Tính</title>
</head>
<body>
    <!-- Ô input để nhập số -->
    <input type="number" id="number1" placeholder="Nhập số thứ nhất">
    <input type="number" id="number2" placeholder="Nhập số thứ hai">

    <!-- Nút button cho cộng, trừ, nhân, chia -->
    <button data-operator="+">Cộng</button>
    <button data-operator="-">Trừ</button>
    <button data-operator="*">Nhân</button>
    <button data-operator="/">Chia</button>

    <!-- Thẻ <p> để hiển thị kết quả -->
    <p id="result"></p>

    <!-- Liên kết file JavaScript -->
    <script src="script.js"></script>
</body>
</html>
